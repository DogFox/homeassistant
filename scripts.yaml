leak_turn_off_relay:
  alias: Отключить реле при протечке
  fields:
    location:
      name: Место протечки
      required: true
      selector:
        text:
  mode: parallel
  max: 5
  sequence:
  - type: turn_off
    device_id: 45e4a65dfcd6b56a72106759a5ab79a9
    entity_id: 871d234e83d558a72f943c21ad4fc4f6
    domain: switch
    continue_on_error: true
  - repeat:
      sequence:
      - delay:
          seconds: 1
      until:
      - condition: or
        conditions:
        - condition: device
          type: is_off
          device_id: 45e4a65dfcd6b56a72106759a5ab79a9
          entity_id: 871d234e83d558a72f943c21ad4fc4f6
          domain: switch
        - condition: template
          value_template: "{{ repeat.index >= 10 }}"
  - if:
    - condition: not
      conditions:
      - condition: device
        type: is_off
        device_id: 45e4a65dfcd6b56a72106759a5ab79a9
        entity_id: 871d234e83d558a72f943c21ad4fc4f6
        domain: switch
    then:
    - action: persistent_notification.create
      data:
        title: Не подтверждено отключение реле при протечке
        message: "Обнаружена протечка {{ location }}. Проверьте положение крана вручную."
    - action: notify.send_message
      target:
        entity_id:
        - notify.telegram_bot_7420407717_299057544
        - notify.telegram_bot_7420407717_310816124
      data:
        message: "Протечка {{ location }}. Реле не подтвердило отключение, проверьте кран."
