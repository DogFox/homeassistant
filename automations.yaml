- id: '1789406718654'
  alias: Вытяжка на двухканальном выключателе Lumi
  triggers:
  - trigger: state
    entity_id: switch.lumi_ctrl_neutral2_v1_180f_left_switch_service
    to: 'on'
    id: light_on
  - trigger: state
    entity_id: switch.lumi_ctrl_neutral2_v1_180f_left_switch_service
    to: 'off'
    id: light_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: light_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.lumi_ctrl_neutral2_v1_180f_right_switch_service
    - conditions:
      - condition: trigger
        id: light_off
      sequence:
      - delay:
          minutes: 5
      - condition: state
        entity_id: switch.lumi_ctrl_neutral2_v1_180f_left_switch_service
        state: 'off'
      - action: switch.turn_off
        target:
          entity_id: switch.lumi_ctrl_neutral2_v1_180f_right_switch_service
  mode: restart
- id: '1789406960089'
  alias: Вытяжка на втором двухканальном выключателе
  triggers:
  - trigger: device
    type: turned_on
    device_id: a44e900c191901e2e0fad23eeaf33be5
    entity_id: 95af3477327a453d4c72594d76632ee2
    domain: switch
    id: light_on
  - trigger: device
    type: turned_off
    device_id: a44e900c191901e2e0fad23eeaf33be5
    entity_id: 95af3477327a453d4c72594d76632ee2
    domain: switch
    id: light_off
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.entity_id != 'switch.lumi_ctrl_neutral2_v1_180f_left_switch_service' }}
  actions:
  - variables:
      fan_candidates: >-
        {{ device_entities('a44e900c191901e2e0fad23eeaf33be5')
           | select('match', '^switch[.]')
           | reject('eq', trigger.entity_id) | list }}
  - if:
    - condition: template
      value_template: "{{ fan_candidates | count != 1 }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: exhaust_fan_entity
        title: Требуется проверить настройку вытяжки
        message: Не удалось однозначно определить канал вытяжки на двухканальном выключателе.
    - stop: Канал вытяжки не определён
  - choose:
    - conditions:
      - condition: trigger
        id: light_on
      sequence:
      - action: switch.turn_on
        target:
          entity_id: "{{ fan_candidates[0] }}"
    - conditions:
      - condition: trigger
        id: light_off
      sequence:
      - delay:
          minutes: 5
      - condition: template
        value_template: "{{ is_state(trigger.entity_id, 'off') }}"
      - action: switch.turn_off
        target:
          entity_id: "{{ fan_candidates[0] }}"
  mode: restart
