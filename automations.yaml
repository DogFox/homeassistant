        domain: switch
      - type: turn_off
        device_id: caef9452b370e68fd0bfdbd03502ae0e
        entity_id: 21c9cfe8783fd69d740354df9027b688
        domain: switch
  mode: restart
- id: '1787748510293'
  alias: Датчик протечки под унитазом
  triggers:
  - trigger: template
    value_template: >-
      {{ expand(device_entities('45e4a65dfcd6b56a72106759a5ab79a9'))
          | selectattr('entity_id', 'match', '^binary_sensor[.]')
          | selectattr('attributes.device_class', 'defined')
          | selectattr('attributes.device_class', 'eq', 'moisture')
          | selectattr('state', 'eq', 'on') | list | count > 0 }}
  actions:
  - parallel:
    - sequence:
      - action: script.leak_turn_off_relay
        data:
          location: под унитазом
    - sequence:
      - action: notify.send_message
        target:
          entity_id:
          - notify.telegram_bot_7420407717_299057544
          - notify.telegram_bot_7420407717_310816124
        data:
          message: Обнаружена протечка под унитазом
  mode: single
