- id: '1756475470122'
  alias: Вытяжка со светом
  triggers:
  - trigger: device
    type: turned_on
    device_id: caef9452b370e68fd0bfdbd03502ae0e
    entity_id: 11c8553a857d658097034165cff3efd6
    domain: switch
    id: light_on
  - trigger: device
    type: turned_off
    device_id: caef9452b370e68fd0bfdbd03502ae0e
    entity_id: 11c8553a857d658097034165cff3efd6
    domain: switch
    id: light_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: light_on
      sequence:
      - type: turn_on
        device_id: caef9452b370e68fd0bfdbd03502ae0e
        entity_id: 21c9cfe8783fd69d740354df9027b688
        domain: switch
    - conditions:
      - condition: trigger
        id: light_off
      sequence:
      - delay:
          minutes: 5
      - condition: device
        type: is_off
        device_id: caef9452b370e68fd0bfdbd03502ae0e
        entity_id: 11c8553a857d658097034165cff3efd6
        domain: switch
      - type: turn_off
        device_id: caef9452b370e68fd0bfdbd03502ae0e
        entity_id: 21c9cfe8783fd69d740354df9027b688
        domain: switch
  mode: restart
